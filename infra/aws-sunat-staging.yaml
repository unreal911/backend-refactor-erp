AWSTemplateFormatVersion: "2010-09-09"
Description: Infraestructura privada SUNAT para staging o produccion (S3, KMS, IAM y CloudTrail).

Parameters:
  Environment:
    Type: String
    AllowedValues: [staging, production]
  WorkloadPrincipalArn:
    Type: String
    Description: ARN del principal federado/rol que asume los roles desde Railway; nunca root.
  WorkloadExternalId:
    Type: String
    NoEcho: true
    MinLength: 16
  NoncurrentRetentionDays:
    Type: Number
    Default: 90
    MinValue: 30

Resources:
  ArtifactKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub "SSE-KMS artefactos SUNAT ${Environment}"
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AccountAdministration
            Effect: Allow
            Principal: { AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root" }
            Action: "kms:*"
            Resource: "*"
  ArtifactKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/tienda-sunat-artifacts-${Environment}"
      TargetKeyId: !Ref ArtifactKey

  EnvelopeKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub "Envelope encryption secretos SUNAT ${Environment}"
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AccountAdministration
            Effect: Allow
            Principal: { AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root" }
            Action: "kms:*"
            Resource: "*"
  EnvelopeKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/tienda-sunat-secrets-${Environment}"
      TargetKeyId: !Ref EnvelopeKey

  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt ArtifactKey.Arn
            BucketKeyEnabled: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        Rules:
          - Id: RetainPreviousVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: !Ref NoncurrentRetentionDays

  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt ArtifactBucket.Arn
              - !Sub "${ArtifactBucket.Arn}/*"
            Condition: { Bool: { "aws:SecureTransport": "false" } }
          - Sid: DenyUnencryptedUploads
            Effect: Deny
            Principal: "*"
            Action: s3:PutObject
            Resource: !Sub "${ArtifactBucket.Arn}/tenants/*"
            Condition: { StringNotEquals: { "s3:x-amz-server-side-encryption": "aws:kms" } }
          - Sid: DenyWrongKmsKey
            Effect: Deny
            Principal: "*"
            Action: s3:PutObject
            Resource: !Sub "${ArtifactBucket.Arn}/tenants/*"
            Condition:
              StringNotEquals:
                "s3:x-amz-server-side-encryption-aws-kms-key-id": !GetAtt ArtifactKey.Arn

  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "tienda-sunat-api-${Environment}"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { AWS: !Ref WorkloadPrincipalArn }
            Action: sts:AssumeRole
            Condition: { StringEquals: { "sts:ExternalId": !Ref WorkloadExternalId } }
      Policies:
        - PolicyName: SunatApiMinimum
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:ListBucket]
                Resource: !GetAtt ArtifactBucket.Arn
                Condition: { StringLike: { "s3:prefix": ["tenants/*"] } }
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion, s3:PutObject]
                Resource: !Sub "${ArtifactBucket.Arn}/tenants/*"
              - Effect: Allow
                Action: [kms:Encrypt, kms:Decrypt, kms:GenerateDataKey, kms:DescribeKey]
                Resource: [!GetAtt ArtifactKey.Arn, !GetAtt EnvelopeKey.Arn]

  WorkerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "tienda-sunat-worker-${Environment}"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { AWS: !Ref WorkloadPrincipalArn }
            Action: sts:AssumeRole
            Condition: { StringEquals: { "sts:ExternalId": !Ref WorkloadExternalId } }
      Policies:
        - PolicyName: SunatWorkerMinimum
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:ListBucket]
                Resource: !GetAtt ArtifactBucket.Arn
                Condition: { StringLike: { "s3:prefix": ["tenants/*"] } }
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion, s3:PutObject, s3:DeleteObject]
                Resource: !Sub "${ArtifactBucket.Arn}/tenants/*"
              - Effect: Allow
                Action: [kms:Encrypt, kms:Decrypt, kms:GenerateDataKey, kms:DescribeKey]
                Resource: [!GetAtt ArtifactKey.Arn, !GetAtt EnvelopeKey.Arn]

  TrailBucket:
    Type: AWS::S3::Bucket
    Properties:
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      VersioningConfiguration: { Status: Enabled }
  TrailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TrailBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudTrailAclCheck
            Effect: Allow
            Principal: { Service: cloudtrail.amazonaws.com }
            Action: s3:GetBucketAcl
            Resource: !GetAtt TrailBucket.Arn
            Condition: { StringEquals: { "AWS:SourceArn": !Sub "arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/tienda-sunat-${Environment}" } }
          - Sid: CloudTrailWrite
            Effect: Allow
            Principal: { Service: cloudtrail.amazonaws.com }
            Action: s3:PutObject
            Resource: !Sub "${TrailBucket.Arn}/AWSLogs/${AWS::AccountId}/*"
            Condition:
              StringEquals:
                "s3:x-amz-acl": bucket-owner-full-control
                "AWS:SourceArn": !Sub "arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/tienda-sunat-${Environment}"

  AuditTrail:
    Type: AWS::CloudTrail::Trail
    DependsOn: TrailBucketPolicy
    Properties:
      TrailName: !Sub "tienda-sunat-${Environment}"
      S3BucketName: !Ref TrailBucket
      IsLogging: true
      IsMultiRegionTrail: true
      IncludeGlobalServiceEvents: true
      EnableLogFileValidation: true
      EventSelectors:
        - IncludeManagementEvents: true
          ReadWriteType: All
          DataResources:
            - Type: AWS::S3::Object
              Values: [!Sub "${ArtifactBucket.Arn}/tenants/"]

Outputs:
  ArtifactBucketName: { Value: !Ref ArtifactBucket }
  ArtifactKmsKeyArn: { Value: !GetAtt ArtifactKey.Arn }
  EnvelopeKmsKeyArn: { Value: !GetAtt EnvelopeKey.Arn }
  ApiRoleArn: { Value: !GetAtt ApiRole.Arn }
  WorkerRoleArn: { Value: !GetAtt WorkerRole.Arn }
  TrailArn: { Value: !GetAtt AuditTrail.Arn }
